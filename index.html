<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Theory</title>
<style>
:root{--bg:#070713;--card:rgba(255,255,255,.05);--fg:#eef0ff;--mut:#9a9cc4;--a:#8b5cf6;--b:#22d3ee;--line:rgba(255,255,255,.12);--glow:.35;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f2ff;--card:rgba(255,255,255,.75);--fg:#171633;--mut:#5d5f86;--a:#6d3fe0;--b:#0891b2;--line:rgba(60,50,140,.16);--glow:.12;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f2ff;--card:rgba(255,255,255,.75);--fg:#171633;--mut:#5d5f86;--a:#6d3fe0;--b:#0891b2;--line:rgba(60,50,140,.16);--glow:.12;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(40vmax 40vmax at 85% 10%,var(--a),transparent 70%),radial-gradient(36vmax 36vmax at 5% 95%,var(--b),transparent 70%);opacity:var(--glow);animation:drift 14s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
@keyframes drift{to{transform:scale(1.15) translate(-2%,2%)}}
.deck{height:100%;position:relative;z-index:2}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 8vw;opacity:0;visibility:hidden;transform:translateX(calc(var(--dx,1)*50px)) scale(.98);transition:opacity .5s,transform .5s,visibility .5s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.past{transform:translateX(calc(var(--dx,1)*-50px)) scale(.98)}
.slide[data-s="A"]{--c:var(--a)}.slide[data-s="B"]{--c:var(--b)}.slide[data-s="T"]{--c:var(--a)}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.35rem .9rem;border-radius:99px;color:var(--c);border:1px solid var(--c);background:var(--card);box-shadow:0 0 18px -4px var(--c);margin-bottom:1.1rem}
.g{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(2.6rem,8vw,5.5rem);margin:0 0 .6rem;line-height:1.02;letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,4.5vw,3.2rem);margin:0 0 1.4rem;line-height:1.12;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:clamp(1rem,2vw,1.4rem);max-width:44ch}
.row{display:flex;gap:3vw;align-items:center;flex-wrap:wrap}.row>div:first-child{flex:1 1 20rem}
ul{list-style:none;padding:0;margin:0;display:grid;gap:.75rem;max-width:60rem}
li{font-size:clamp(1rem,2.1vw,1.5rem);background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:14px;padding:.8rem 1.1rem;backdrop-filter:blur(10px);opacity:0;transform:translateY(16px)}
.on li{animation:up .55s forwards;animation-delay:calc(.15s + var(--i)*.13s)}
@keyframes up{to{opacity:1;transform:none}}
.ex{margin-top:1.2rem;color:var(--mut);font-size:clamp(.95rem,1.8vw,1.2rem)}.ex b{color:var(--c)}
table{border-collapse:separate;border-spacing:6px;margin-top:1rem;font-size:clamp(.9rem,1.9vw,1.3rem)}
td,th{padding:.7rem 1.1rem;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px}
th{color:var(--mut);font-weight:600;background:none;border:0}td.n{border-color:var(--c);box-shadow:0 0 22px -4px var(--c);font-weight:700}
.pic{width:clamp(150px,22vw,260px);aspect-ratio:3/4;border-radius:20px;border:1px dashed var(--c);display:grid;place-items:center;text-align:center;color:var(--mut);background:var(--card);box-shadow:0 0 40px -10px var(--c);font-size:.85rem;padding:1rem}
.pic b{display:block;font-size:2.6rem;margin-bottom:.3rem}
.bar{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 12px var(--b);transition:width .3s;z-index:5}
.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:18px;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.9rem;z-index:5}
.nav button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;backdrop-filter:blur(8px)}
.nav button:hover{border-color:var(--b)}
img.pic{border-style:solid;object-fit:cover;padding:0}
.pic.ph{aspect-ratio:1;width:clamp(170px,26vw,320px)}
table.pd{border-spacing:10px;font-size:clamp(1.2rem,3.2vw,2.3rem);margin-top:1rem}
table.pd td{padding:clamp(1rem,3vw,2rem) clamp(1.2rem,4vw,3rem);border-radius:18px;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(34,211,238,.15));font-weight:700;border-color:var(--line)}
table.pd th{font-size:clamp(.85rem,1.6vw,1.1rem)}
.x{color:var(--a)}.y{color:var(--b)}
.math{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic;font-size:clamp(1.05rem,2.5vw,1.8rem);padding:1rem 1.4rem;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:1rem 0;overflow-x:auto;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;max-width:62rem}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:1.1rem 1.3rem;font-size:clamp(.9rem,1.7vw,1.15rem);line-height:1.5}
.card h3{margin:0 0 .5rem;color:var(--c);font-size:1.3em}
.chain{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:1.1rem;color:var(--mut)}
.chain span{background:var(--card);border:1px solid var(--c);border-radius:10px;padding:.4rem .8rem;color:var(--fg);font-size:clamp(.8rem,1.6vw,1.05rem)}
.mt{border-collapse:separate;border-spacing:4px;font-size:clamp(.95rem,2vw,1.4rem);font-family:"Cambria Math",Georgia,serif}.mt td.h{border-color:var(--c);box-shadow:0 0 18px -4px var(--c);font-weight:700}
svg.dg{width:100%;max-width:62rem;height:auto}svg.dg text{fill:var(--fg);font-size:16px;text-anchor:middle;font-weight:600}svg.dg .s{fill:var(--mut);font-weight:400;font-size:14px}
svg.dg .bx{fill:var(--card);stroke:var(--line);stroke-width:1.5}svg.dg .ga{stroke:var(--a);stroke-width:2.5}svg.dg .gb{stroke:var(--b);stroke-width:2.5}
svg.dg .ln{fill:none;stroke:var(--mut);stroke-width:2;marker-end:url(#ar)}svg.dg .fl{fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:9 7;animation:dash 1s linear infinite;marker-end:url(#ar)}
@keyframes dash{to{stroke-dashoffset:-16}}
.ctl{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:8px;z-index:6}.ctl button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:.5rem .9rem;font:inherit;font-size:.85rem;cursor:pointer;backdrop-filter:blur(8px)}.ctl button:hover{border-color:var(--b)}
.qr{display:flex;gap:1.4rem;align-items:center;margin-top:2rem;color:var(--mut);font-size:clamp(.95rem,1.8vw,1.2rem)}.qr svg{width:clamp(130px,16vw,190px);height:auto;border-radius:14px;box-shadow:0 0 30px -8px var(--b)}
.fa body,.fa{font-family:Vazirmatn,Tahoma,system-ui,sans-serif}.fa h1,.fa h2{letter-spacing:0}.fa .bar{left:auto;right:0}.fa .nav{right:auto;left:18px}.fa .ctl{right:auto;left:16px}
.fa .math,.fa .mt,.fa svg.dg{direction:ltr}.fa .math{text-align:left}.fa li{border-left:1px solid var(--line);border-right:3px solid var(--c)}
.fa{--dx:-1}
body.phone .deck{width:min(100vw,420px);height:min(100%,880px);margin:0 auto;position:relative;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 0 60px -20px var(--a)}
body.phone .slide{padding:32px 22px;overflow-y:auto;justify-content:safe center}
body.phone h1{font-size:2.3rem}body.phone h2{font-size:1.55rem;margin-bottom:1rem}body.phone li{font-size:.95rem;padding:.65rem .85rem}body.phone .sub,body.phone .ex{font-size:.9rem}
body.phone table.pd{font-size:1rem}body.phone table.pd td{padding:.9rem 1rem}body.phone .math{font-size:.95rem}body.phone .card{font-size:.88rem}body.phone .mt{font-size:.95rem}
body.phone .pic{width:130px}body.phone .pic.ph{width:150px}body.phone .chain span{font-size:.72rem}body.phone .qr{flex-direction:column;align-items:flex-start}body.phone .nav{right:50%;transform:translateX(50%)}
#pad{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s}#pad span{position:absolute;left:0;top:0;font-size:44px;line-height:1;will-change:transform}
@keyframes tIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.fadeT{opacity:0}.slide.on .fadeT{animation:tIn 1s 1.1s both}
.hero{display:flex;align-items:center;justify-content:space-between;gap:4vw;flex-wrap:wrap}.hero>div:first-child{flex:1 1 22rem}
.qr{flex-direction:column;text-align:center;margin-top:0}.qr svg{width:clamp(230px,26vw,360px);box-shadow:0 0 50px -10px var(--a),0 0 0 1px var(--line)}
.pic.bird{aspect-ratio:auto;height:auto;width:clamp(240px,32vw,440px);background:#fff;object-fit:contain;padding:6px;border-style:solid}
table.pd.sm{font-size:clamp(1rem,2.2vw,1.6rem);margin-top:.8rem}table.pd.sm td{padding:clamp(.6rem,1.6vw,1.1rem) clamp(.8rem,2.4vw,1.8rem)}
.br{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}table.pd td.nn{border-color:var(--c);box-shadow:0 0 24px -4px var(--c)}
.bars{display:grid;gap:.25rem;max-width:62rem}.bw{display:grid;grid-template-columns:clamp(8rem,16vw,12rem) 1fr;align-items:center;gap:.6rem;font-size:clamp(.7rem,1.35vw,.95rem)}.bw span{color:var(--mut)}
.bw i{font-style:normal;display:block;background:linear-gradient(90deg,var(--a),var(--b));opacity:.55;border-radius:6px;padding:.1rem .5rem;color:#fff;text-align:right;min-height:1.1rem;transform-origin:left}.bw.hl i{opacity:1;box-shadow:0 0 16px -2px var(--b)}.bw.hl span{color:var(--fg);font-weight:700}
.on .bw i{animation:grow .9s both}@keyframes grow{from{transform:scaleX(0)}}.fa .bw i{transform-origin:right;text-align:left}
.chain b{min-width:6.5rem;color:var(--fg)}.chain span.c{border-color:var(--b)}.chain span.d{border-color:var(--a);color:var(--a)}
body.phone .hero{flex-direction:column;text-align:center;gap:1.4rem}body.phone .hero>div:first-child{flex:none}body.phone .sub{margin:0 auto}
body.phone .qr{align-items:center;margin:0 auto}body.phone .qr svg{width:min(72vw,290px)}body.phone .pic.bird{width:100%;max-width:300px}
body.phone .bw{grid-template-columns:6.4rem 1fr;font-size:.7rem}html.fa body.phone .nav{right:auto;left:50%;transform:translateX(-50%)}
.slide[data-s="R"]{--c:var(--a)}.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.5rem .9rem;max-width:64rem}
.refs a{color:var(--fg);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem;font-size:clamp(.72rem,1.4vw,.95rem);overflow-wrap:anywhere;direction:ltr;text-align:left;backdrop-filter:blur(8px)}
.refs a b{color:var(--b);margin-right:.5rem}.refs a:hover{border-color:var(--b)}
img.pic{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,5,15,.88);backdrop-filter:blur(10px);padding:4vmin;cursor:zoom-out}
#lb.on{display:flex;animation:lbin .25s}@keyframes lbin{from{opacity:0}}
#lb img{max-width:100%;max-height:100%;border-radius:14px;background:#fff;box-shadow:0 0 60px -10px var(--a)}
#lbx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:1.2rem;cursor:pointer}
.by{margin-top:1.2rem;color:var(--fg);font-weight:700;font-size:clamp(1rem,2vw,1.35rem)}
.rd .flow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1.2rem;max-width:64rem}.rd .flow i{font-style:normal;color:var(--b);font-size:1.3rem}
.nd{background:var(--card);border:1px solid var(--c);border-radius:12px;padding:.55rem .8rem;font-size:clamp(.75rem,1.5vw,1rem);flex:1 1 9rem;text-align:center;backdrop-filter:blur(8px)}
.rr{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;align-items:center}.sc{position:relative;flex:1 1 16rem;height:3.8rem;margin:0 2rem;direction:ltr}
.scb{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 14px -2px var(--b)}
.sc span{position:absolute;top:1.3rem;transform:translateX(-50%);text-align:center;font-size:clamp(.7rem,1.3vw,.9rem);color:var(--mut);white-space:nowrap}
</style>

{s:'A',t:'John von Neumann',p:['Born 1903 in Budapest, Hungary; died 1957 in Washington, D.C.','Studied chemical engineering at ETH Zurich and earned a PhD in mathematics at the University of Budapest (1926)','Also studied in Berlin, then worked at Göttingen before moving to Princeton','Proved the minimax theorem (1928); co-wrote <i>Theory of Games and Economic Behavior</i> (1944)'],pic:1},

{s:'A',t:'Non-Dominant Strategies',p:['Dominated: another strategy is always at least as good (strictly or weakly)','Dominated strategies can be eliminated from the game','Some games have no dominant strategy at all'],x:'<b>Example:</b> rock, paper, scissors.'},
{s:'A',t:'Zero-Sum Games',p:['One player’s gain is exactly the other’s loss','Total payoff is always zero: u₁ + u₂ = 0','Pure conflict: there is no room for cooperation','Next: the maximin principle, then chess and poker']},
{s:'A',t:'Maximin: the Idea',p:['Assume the opponent will hurt you as much as possible','For each of your strategies, find the worst payoff it can give','Choose the strategy whose worst case is best (“maximize the minimum”)'],x:'<div class="math">v<sub>A</sub> = max<sub>s∈S<sub>A</sub></sub> min<sub>t∈S<sub>B</sub></sub> u<sub>A</sub>(s, t)</div>The opponent does the mirror image, <i>minimax</i>: v̄ = min<sub>t</sub> max<sub>s</sub> u<sub>A</sub>(s, t). Always v<sub>A</sub> ≤ v̄.'},
{s:'A',t:'Maximin: Worked Example',p:['Payoffs to A. Row minimum = worst case of each strategy','Maximin: A2, because its worst case (0) beats −1 and −2','Minimax: B picks the column with the smallest maximum, which is 2','0 ≠ 2: no saddle point, so mixed strategies are needed. Von Neumann’s minimax theorem says max min = min max once mixing is allowed'],raw:'<table class="mt"><tr><td></td><td>B1</td><td>B2</td><td>B3</td><td>row min</td></tr><tr><td>A1</td><td>3</td><td>−1</td><td>2</td><td>−1</td></tr><tr><td>A2</td><td>1</td><td>0</td><td>2</td><td class="h">0</td></tr><tr><td>A3</td><td>−2</td><td>4</td><td>1</td><td>−2</td></tr><tr><td>col max</td><td>3</td><td>4</td><td class="h">2</td><td></td></tr></table>'},
{s:'A',t:'Zero-Sum in Practice',raw:'<div class="cards"><div class="card"><h3>Chess</h3>Two players, no hidden information. Win = +1, draw = 0, loss = −1, so the payoffs always cancel out.<br>Zermelo’s theorem (1913): in such finite games, either one side can force a win or both can force at least a draw.<br>But there are around 10<sup>120</sup> possible games (the Shannon number), so the perfect strategy is still unknown.</div><div class="card"><h3>Poker</h3>Cards are hidden, so information is incomplete. What one player wins, the others lose (apart from the house’s cut).<br>Bluffing is a mixed strategy: good players randomize so opponents cannot exploit a pattern.<br>Heads-up limit hold’em was essentially solved in 2015 by the Cepheus program from the University of Alberta.</div></div>'},
{s:'A',t:'Non-Zero-Sum Games',p:['Total payoff changes depending on the choices made','Players can all gain (win-win) or all lose','Cooperation becomes possible and sometimes valuable'],x:'<b>Example:</b> the Prisoner’s Dilemma, trade agreements.'},
{s:'A',t:'What Is a GAN?',p:['Generative Adversarial Network, introduced by Ian Goodfellow and colleagues in 2014','Goal: generate new data that looks real (faces, art, music)','Two neural networks play against each other: a generator that makes fakes and a discriminator that judges them','Like a counterfeiter and a bank inspector, each forcing the other to improve','“Adversarial” means a game, so GANs are game theory in action']},
{s:'A',t:'The GAN as a Minimax Game',p:['D (discriminator) wants to maximize V: say “real” for real data, “fake” for G’s output','G (generator) wants to minimize V: make D believe its fakes are real','Zero-sum: D’s gain is G’s loss, just like the maximin idea','At the equilibrium, G’s output matches the real data and D can only guess (D = ½)'],x:'<div class="math">min<sub>G</sub> max<sub>D</sub> V(D, G) = E<sub>x∼p<sub>data</sub></sub>[log D(x)] + E<sub>z∼p<sub>z</sub></sub>[log(1 − D(G(z)))]</div>'},
{s:'A',t:'Generator vs. Discriminator',p:['Generator: turns random noise into fake data (e.g. images)','Discriminator: judges whether data is real or fake'],raw:DG},
{s:'A',t:'The Training Loop',p:['1. G turns random noise into a fake image','2. D receives a mix of real and fake images and guesses which is which','3. D is updated to catch fakes better; G is updated, using D’s feedback, to fool D better','4. Repeat thousands of times: fakes get more convincing and D gets sharper, until D is right only about 50% of the time']},
{s:'A',t:'Problems of GANs',p:['Mode collapse: the generator produces only a few kinds of output','Unstable training: the two networks may never settle at equilibrium','Vanishing gradients when the discriminator gets too strong','Hard to measure how good the results really are']},
{s:'A',t:'CNN: What and Why',p:['Convolutional Neural Network, built for grid-like data such as images','An image is a grid of pixels (numbers 0 to 255); color images have 3 channels (R, G, B)','A plain dense network needs a weight for every pixel: a 224×224 color image has 150,528 inputs per neuron','A CNN reuses small filters across the image: far fewer parameters, and a pattern is found wherever it appears','Used in face recognition, medical imaging, self-driving cars']},
{s:'A',t:'Convolution: Sliding a Filter',p:['A small filter (kernel), e.g. 3×3, slides across the image','At each position: multiply, add up, write one number into the feature map','Early filters detect edges; deeper ones detect shapes and object parts'],x:'<div class="math">(I ∗ K)(i, j) = Σ<sub>m</sub> Σ<sub>n</sub> I(i+m, j+n) · K(m, n)</div>',pic:2},
{s:'A',t:'Pooling and Architecture',p:['ReLU: f(x) = max(0, x) adds non-linearity','Max pooling (2×2) keeps the strongest value in each block and halves the size','Stack the blocks, then flatten and classify with fully connected layers and softmax (probabilities)','Link to GANs: image GANs (such as DCGAN) use CNNs in both the generator and the discriminator'],raw:'<div class="chain"><span>Image</span>→<span>Conv + ReLU</span>→<span>Pool</span>→<span>Conv + ReLU</span>→<span>Pool</span>→<span>Flatten</span>→<span>Dense</span>→<span>Softmax</span></div>'},
{s:'B',t:'Nash Equilibrium',p:['A set of strategies, one per player, where no one gains by changing only their own strategy','Everyone is playing a best response to what the others do','Pure Nash equilibrium: each player picks one fixed strategy','A game can have one, several, or (in pure strategies) none'],x:NM+'<b>Example:</b> two companies choosing prices or profit levels: neither can raise profit by changing its price alone.'},
{s:'B',t:'Nash Equilibrium in the Prisoner’s Dilemma',p:['Underline each player’s best reply to each choice of the other','If B denies: A gets 0 by confessing and −1 by denying, so A confesses. If B confesses: −2 beats −3, so A confesses again','The same holds for B. Only (confess, confess) has both payoffs underlined: it is the Nash equilibrium','Neither prisoner gains by switching alone, yet both denying (−1 , −1) would be better for both'],raw:g2(PDH,PDR,PDC,3)},
{s:'B',t:'Pareto Optimality',p:['No one can be better off without making someone worse off','A state can be both Nash and Pareto optimal','Prisoner’s Dilemma: Nash, but not Pareto optimal']},
{s:'B',t:'Repeated Games',p:['The same players play the same game again and again','Today’s choice can be rewarded or punished tomorrow','So cooperation can pay off, even for selfish players','The one-shot Prisoner’s Dilemma gets a different answer once it repeats']},
{s:'B',t:'Example: Sharing the Dishes',p:['Two roommates, one kitchen, dirty dishes every night','Wash them (a cost to you, a clean kitchen for both) or leave them for the other','One night only: leaving them is the dominant strategy, so both leave them and the kitchen is a mess','Same structure as the Prisoner’s Dilemma: temptation beats cooperation'],raw:g2(['Roommate washes','Roommate leaves'],['You wash','You leave'],DC,-1)+'<div class="ex">Payoffs are points of comfort (<span class="x">You</span> , <span class="y">Roommate</span>). Leaving the dishes while the other washes is best (5); washing while the other leaves is worst (0).</div>'},
{s:'B',t:'Dishes Every Night: Why Cooperating Pays',p:['Tonight’s choice affects tomorrow: a roommate left with dirty dishes can stop washing','Strategy: wash tonight, but if your roommate ever leaves you the dishes, never wash again (grim trigger)'],x:'If the relationship is likely to continue, washing is the rational choice, not just the kind one.'},
{s:'B',t:'Axelrod’s Tournaments: Who Played',p:['1980: Robert Axelrod invited game theorists to submit programs for the repeated Prisoner’s Dilemma','First tournament: 14 entries plus a RANDOM program (15 players), from five disciplines: psychology, economics, political science, mathematics and sociology','Second tournament: 62 entries plus RANDOM, from six countries; entrants had seen the first results','Programs could see the full history of play but could not communicate']},
{s:'B',t:'Rules, Scoring and Limits',raw:rules(['15 programs (14 entries + RANDOM)','Round robin: each plays every other, itself and RANDOM','One game: 200 moves, each C or D, no talking','Whole tournament run 5 times, scores averaged','Points per move (You , Them). Second tournament: games ended at random (about 200 moves).','always defect','always cooperate','Total score over one 200-move game: from 0 to 1000.'],['They cooperate','They defect'],['You cooperate','You defect'],'→')},
{s:'B',t:'Tit for Tat vs. the Field',raw:bars()+'<div class="ex">First tournament, average points per game (scale 0 to 600; 600 = cooperating all game, 200 = defecting all game). Source: Axelrod, “Effective Choice in the Prisoner’s Dilemma” (1980). Later reproductions show the ranking depends on the tournament design.</div>'},
{s:'B',t:'How Tit for Tat Works',p:['Rule 1: cooperate on the first move','Rule 2: afterwards, do whatever the opponent did on the previous move','It remembers only one move, yet answers kindness with kindness and betrayal with betrayal','It was the simplest entry, submitted by Anatol Rapoport (University of Toronto)'],raw:seq('Opponent','CCDCCDD')+seq('Tit for tat','CCCDCCD')+'<div class="ex">C = cooperate, D = defect</div>'},
{s:'B',t:'Why Tit for Tat Worked',p:['Nice: it never defects first, so it does well with other nice programs (close to 600 together)','Retaliatory: it answers a defection at once, so exploiters gain only one time','Forgiving: after one punishment it cooperates again, which ends feuds','Clear: opponents see the pattern easily and learn that cooperation pays','It never beat its partner in a single game, but it earned the most in total by drawing out cooperation','Caveat: later reproductions show its success depends on the tournament design and payoffs']},
{s:'B',t:'Repeated-Game Strategies',p:['Tit for two tats: retaliate only after two defections in a row','Always cooperate','Always defect','Grim trigger: cooperate until betrayed, then defect forever','Win-Stay, Lose-Shift: reacts to the outcome, not only to cooperation']},
{s:'B',t:'Mixed Strategies',p:['Randomly choose between actions with set probabilities','Not irrational: the odds must fit the payoffs and the game’s structure']},
{s:'B',t:'Mixed-Strategy Nash Equilibrium',p:['Each player randomizes so the opponent is indifferent between options','No one gains by changing their probabilities'],x:'<b>Example:</b> rock, paper, scissors, each at 1/3.'},
{s:'B',t:'Bayesian Nash Equilibrium',p:['Nash equilibrium for games with incomplete information','Players hold beliefs about hidden information (types)','Each strategy is a best response given those beliefs']},
{s:'R',t:'References',raw:RF},
{s:'T',t:'Thank <span class="g">You</span>',sub:'Questions?'+'<div class="by">Arash Ghavamian and Anita Judi</div>'}

{t:'مجموع صفر در عمل',raw:'<div class="cards"><div class="card"><h3>شطرنج</h3>دو بازیکن، بدون اطلاعات پنهان. برد یک امتیاز مثبت، تساوی صفر، باخت یک امتیاز منفی؛ پس امتیازها همیشه همدیگر را خنثی می‌کنند.<br>قضیه زرملو (1913): در چنین بازی‌های متناهی، یا یک طرف می‌تواند برد را تحمیل کند یا هر دو می‌توانند دست‌کم تساوی را تضمین کنند.<br>اما حدود 10<sup>120</sup> بازی ممکن وجود دارد (عدد شانون)، پس راهبرد کامل هنوز ناشناخته است.</div><div class="card"><h3>پوکر</h3>کارت‌ها پنهان‌اند، پس اطلاعات ناقص است. آنچه یک بازیکن می‌برد دیگران می‌بازند (جز سهم خانه).<br>بلوف یک راهبرد مختلط است: بازیکنان خوب تصادفی عمل می‌کنند تا حریف نتواند الگو را پیدا کند.<br>پوکر هدزآپ لیمیت هولدم در 2015 توسط برنامه Cepheus از دانشگاه آلبرتا تقریباً حل شد.</div></div>'},

{t:'GAN چیست؟',p:['شبکه مولد تخاصمی (Generative Adversarial Network)؛ در 2014 توسط ایان گودفلو و همکارانش معرفی شد','هدف: تولید داده‌های جدیدی که واقعی به نظر برسند (چهره، هنر، موسیقی)','دو شبکه عصبی در برابر هم بازی می‌کنند: مولد که جعل می‌کند و متمایزکننده که قضاوت می‌کند','مثل یک جاعل و یک بازرس بانک که هرکدام دیگری را مجبور به پیشرفت می‌کند','«تخاصمی» یعنی بازی؛ پس GAN نظریه بازی‌ها در عمل است']},
{t:'GAN به‌عنوان یک بازی مینی‌مکس',p:['D (متمایزکننده) می‌خواهد V را بیشینه کند: داده واقعی را «واقعی» و خروجی G را «جعلی» بداند','G (مولد) می‌خواهد V را کمینه کند: D را متقاعد کند جعلی‌هایش واقعی‌اند','مجموع صفر: سود D زیان G است، درست مثل ایده maximin','در تعادل، خروجی G با داده واقعی یکی است و D فقط می‌تواند حدس بزند (D = ½)']},

{t:'مشکلات GAN',p:['فروپاشی مُد (mode collapse): مولد فقط چند نوع خروجی می‌سازد','آموزش ناپایدار: دو شبکه ممکن است هرگز به تعادل نرسند','محو شدن گرادیان وقتی متمایزکننده بیش از حد قوی شود','سنجش کیفیت واقعی نتایج دشوار است']},

{t:'تعادل نش',p:['مجموعه‌ای از راهبردها (یکی برای هر بازیکن) که در آن هیچ‌کس با تغییر تنهایی راهبرد خودش سود نمی‌کند','هر بازیکن بهترین پاسخ را به کار دیگران بازی می‌کند','تعادل نش خالص: هر بازیکن یک راهبرد ثابت انتخاب می‌کند','یک بازی می‌تواند یک، چند یا (در راهبردهای خالص) هیچ تعادلی نداشته باشد'],x:NM+'<b>مثال:</b> دو شرکت که قیمت یا سطح سود را انتخاب می‌کنند: هیچ‌کدام با تغییر تنهایی قیمت سود بیشتری نمی‌برد.'},
{t:'تعادل نش در معمای زندانی',p:['برای هر انتخاب طرف مقابل، بهترین پاسخ هر بازیکن را زیرخط‌دار کنید','اگر B انکار کند: A با اعتراف 0 می‌گیرد و با انکار −1، پس اعتراف می‌کند. اگر B اعتراف کند: −2 بهتر از −3 است، پس باز هم اعتراف می‌کند','همین برای B هم صادق است. فقط در خانه (اعتراف، اعتراف) هر دو امتیاز زیرخط دارند: این همان تعادل نش است','هیچ زندانی با تغییر تنهایی سود نمی‌کند، اما انکار هر دو (−1 , −1) برای هر دو بهتر بود'],raw:g2(['زندانی B انکار می‌کند','زندانی B اعتراف می‌کند'],['زندانی A انکار می‌کند','زندانی A اعتراف می‌کند'],PDC,3)},

{t:'بازی‌های تکرارشونده',p:['همان بازیکنان همان بازی را بارها بازی می‌کنند','انتخاب امروز می‌تواند فردا پاداش یا تنبیه شود','پس همکاری حتی برای بازیکنان خودخواه هم می‌تواند سودمند باشد','معمای زندانی یک‌باره وقتی تکرار شود پاسخ دیگری پیدا می‌کند']},
{t:'مثال: شستن ظرف‌ها',p:['دو هم‌خانه، یک آشپزخانه، هر شب ظرف کثیف','ظرف‌ها را بشویید (هزینه برای شما، آشپزخانه تمیز برای هر دو) یا برای دیگری بگذارید','فقط یک شب: رها کردن راهبرد غالب است، پس هر دو رها می‌کنند و آشپزخانه به هم می‌ریزد','ساختار همان معمای زندانی است: وسوسه از همکاری قوی‌تر است'],raw:g2(['هم‌خانه می‌شوید','هم‌خانه رها می‌کند'],['شما می‌شویید','شما رها می‌کنید'],DC,-1)+'<div class="ex">امتیازها میزان آسایش‌اند (<span class="x">شما</span> , <span class="y">هم‌خانه</span>). رها کردن ظرف‌ها وقتی دیگری می‌شوید بهترین (5) و شستن وقتی دیگری رها می‌کند بدترین (0) است.</div>'},

{t:'مسابقات اکسلرود: چه کسانی بازی کردند',p:['1980: رابرت اکسلرود از نظریه‌پردازان بازی دعوت کرد برنامه‌هایی برای معمای زندانی تکرارشونده بفرستند','مسابقه اول: 14 برنامه به‌علاوه یک برنامه تصادفی (RANDOM)، یعنی 15 بازیکن، از پنج رشته: روان‌شناسی، اقتصاد، علوم سیاسی، ریاضی و جامعه‌شناسی','مسابقه دوم: 62 برنامه به‌علاوه RANDOM از شش کشور؛ شرکت‌کنندگان نتایج مسابقه اول را دیده بودند','برنامه‌ها تاریخچه کامل بازی را می‌دیدند اما نمی‌توانستند با هم ارتباط برقرار کنند']},
{t:'قواعد، امتیازدهی و محدودیت‌ها',raw:rules(['15 برنامه (14 شرکت‌کننده + RANDOM)','دوره‌ای کامل: هر برنامه با همه، با خودش و با RANDOM','یک بازی: 200 حرکت، هر حرکت C یا D، بدون ارتباط','کل مسابقه 5 بار اجرا و میانگین‌گیری شد','امتیاز هر حرکت (شما , حریف). مسابقه دوم: پایان بازی تصادفی بود (حدود 200 حرکت).','خیانت دائم','همکاری دائم','مجموع امتیاز یک بازی 200 حرکتی: از 0 تا 1000'],['حریف همکاری می‌کند','حریف خیانت می‌کند'],['شما همکاری می‌کنید','شما خیانت می‌کنید'],'←')},
{t:'Tit for tat در برابر بقیه',raw:bars()+'<div class="ex">مسابقه اول، میانگین امتیاز هر بازی (مقیاس 0 تا 600؛ 600 = همکاری در کل بازی، 200 = خیانت در کل بازی). منبع: اکسلرود، 1980. بازتولیدهای بعدی نشان می‌دهند رتبه‌بندی به طراحی مسابقه وابسته است.</div>'},
{t:'Tit for tat چگونه کار می‌کند',p:['قاعده 1: در حرکت اول همکاری کن','قاعده 2: از آن پس همان کاری را بکن که حریف در حرکت قبلی کرد','فقط یک حرکت را به خاطر دارد، اما مهربانی را با مهربانی و خیانت را با خیانت پاسخ می‌دهد','ساده‌ترین برنامه مسابقه بود و آناتول راپوپورت (دانشگاه تورنتو) آن را فرستاد'],raw:seq('حریف','CCDCCDD')+seq('Tit for tat','CCCDCCD')+'<div class="ex">C = همکاری، D = خیانت</div>'},

{t:'راهبردهای بازی تکرارشونده',p:['Tit for two tats: فقط پس از دو خیانت پیاپی تلافی کن','همیشه همکاری','همیشه خیانت','Grim trigger: تا زمان خیانت همکاری کن، سپس برای همیشه خیانت کن','Win-Stay, Lose-Shift: به نتیجه رفتار قبلی واکنش نشان می‌دهد، نه فقط به همکاری']},

 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 var B=d.getBoundingClientRect(),h1=el[i]&&el[i].querySelector('h1'),R=h1?h1.getBoundingClientRect():{left:B.left+B.width/2,width:0,bottom:B.top+B.height/2};
 var ox=R.left+R.width/2-22,oy=R.bottom;
 PADS.forEach(function(p,k){var a=Math.PI*(.12+.76*k/(PADS.length-1))+(Math.random()-.5)*.25,sp=520+Math.random()*160;p.x=ox;p.y=oy;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.r=0;p.vr=(Math.random()-.5)*70});
 pad.style.opacity=1;padOn=true;padFor=i;lastT=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}

 if(!padOn)return;var dt=lastT?Math.min(.05,(t-lastT)/1000):.016;lastT=t;var B=d.getBoundingClientRect(),Z=44;
 PADS.forEach(function(p){
  var sp=Math.hypot(p.vx,p.vy)||1,ns=55+(sp-55)*Math.pow(.35,dt);p.vx*=ns/sp;p.vy*=ns/sp;
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
  if(p.x<B.left){p.x=B.left;p.vx=Math.abs(p.vx)}if(p.x>B.right-Z){p.x=B.right-Z;p.vx=-Math.abs(p.vx)}
  if(p.y<B.top){p.y=B.top;p.vy=Math.abs(p.vy)}if(p.y>B.bottom-Z){p.y=B.bottom-Z;p.vy=-Math.abs(p.vy)}
  p.e.style.transform='translate('+p.x+'px,'+p.y+'px) rotate('+p.r+'deg)';
 });
 raf=requestAnimationFrame(tick);
}

  var e=document.createElement('section');e.className='slide';e.dataset.s=o.s;var h='';

  else{h='<span class="tag">'+(lang==='fa'?'نفر ':'Person ')+o.s+'</span><h2>'+o.t+'</h2>';
   var l=(o.p?'<ul>'+o.p.map(function(x,k){return '<li style="--i:'+k+'">'+x+'</li>'}).join('')+'</ul>':'')+(o.x?'<div class="ex">'+o.x+'</div>':'');
   h+=(o.pic?'<div class="row"><div>'+l+'</div>'+(o.pic===2?PH:PIC)+'</div>':l)+(o.raw||'');}
  if(lang==='fa')R.forEach(function(r){h=h.split(r[0]).join(r[1])});
  e.innerHTML=h;d.appendChild(e);
 });
 go(i);
}
function ui(){
 var h=document.documentElement,fa=lang==='fa';
 h.dir=fa?'rtl':'ltr';h.lang=lang;h.classList.toggle('fa',fa);
 document.body.classList.toggle('phone',mode==='phone');
 vw.textContent=mode==='phone'?(fa?'🖥️ دسکتاپ':'🖥️ Desktop'):(fa?'📱 موبایل':'📱 Phone');
 lg.textContent=fa?'English':'فارسی';document.getElementById('prev').textContent=fa?'→':'←';document.getElementById('next').textContent=fa?'←':'→';
 build();
}
vw.onclick=function(){mode=mode==='phone'?'desktop':'phone';ui()};
lg.onclick=function(){lang=lang==='fa'?'en':'fa';ui()};
function go(n){
 i=Math.max(0,Math.min(tot-1,n));
 for(var k=0;k<tot;k++){el[k].className='slide'+(k===i?' on':k<i?' past':'')}
 if(i===0||i===tot-1){if(!padOn||padFor!==i)padStart()}else padStop();document.getElementById('bar').style.width=((i+1)/tot*100)+'%';
 document.getElementById('count').textContent=(i+1)+' / '+tot;
}
document.getElementById('next').onclick=function(){go(i+1)};
document.getElementById('prev').onclick=function(){go(i-1)};
document.addEventListener('keydown',function(e){
 if(lbOn()){if(e.key==='Escape')closeLb();e.preventDefault();return}
 var fa=lang==='fa';
 if(['ArrowDown','PageDown',' ',fa?'ArrowLeft':'ArrowRight'].indexOf(e.key)>-1){e.preventDefault();go(i+1)}
 if(['ArrowUp','PageUp',fa?'ArrowRight':'ArrowLeft'].indexOf(e.key)>-1){e.preventDefault();go(i-1)}
 if(e.key==='Home')go(0);if(e.key==='End')go(tot-1);
});
var x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;if(lbOn()){x0=null;return}var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(i+((dx<0)===(lang!=='fa')?1:-1));x0=null});
ui();
</script>
